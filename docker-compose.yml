volumes:
  pgdata:

services:
  pg:
    image: postgres:16-alpine
    container_name: meteogarden_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meteogarden}
      POSTGRES_USER: ${POSTGRES_USER:-meteogarden}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meteogarden}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meteogarden_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      environment.env
    depends_on:
      - pg